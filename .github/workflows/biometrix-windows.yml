name: Biometrix Support core (Windows x64)

on:
  workflow_dispatch:
  push:
    branches:
      - biometrix

env:
  # Same toolchain, LLVM and vcpkg baseline as upstream 1.4.4 (flutter-build.yml).
  RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_TRIPLET: x64-windows-static

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@v1
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: biometrix-windows-2022

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: ${{ env.VCPKG_TRIPLET }}
        run: |
          if ! $VCPKG_ROOT/vcpkg install \
            --triplet $VCPKG_TRIPLET \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"; cat "$_1"; echo
            done
            exit 1
          fi

      - name: Build headless core
        shell: bash
        run: |
          cargo build --release --features biometrix --bins
          mkdir -p ./out
          cp ./target/release/rustdesk.exe ./out/BiometrixSupport.exe
          sha256sum ./out/BiometrixSupport.exe | tee ./out/SHA256SUMS

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: biometrix-support-windows-x64
          path: out
          retention-days: 14
